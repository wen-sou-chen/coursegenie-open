server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://backend:8000; }
  location /exports/ { proxy_pass http://backend:8000; }
  location /images/ { proxy_pass http://backend:8000; }
  location /ppt-files/ { proxy_pass http://backend:8000; }

  location / { try_files $uri $uri/ /index.html; }
}
