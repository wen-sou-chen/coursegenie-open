<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CourseGenie">
  <title>CourseGenie</title>
  <!-- 透明背景（官方建议）：蓝色卡册 + 白色课程页 + 概念双链节点 -->
  <rect x="12" y="10" width="34" height="26" rx="5" fill="#2563EB" opacity="0.28"/>
  <rect x="15" y="14" width="34" height="26" rx="5" fill="#2563EB" opacity="0.55"/>
  <rect x="18" y="18" width="34" height="26" rx="5" fill="#2563EB"/>
  <rect x="22.5" y="23" width="25" height="16" rx="2.5" fill="#FFFFFF"/>
  <rect x="26" y="27" width="16" height="2.6" rx="1.3" fill="#2563EB"/>
  <rect x="26" y="32" width="11" height="2.6" rx="1.3" fill="#93B4FF"/>
  <!-- 概念双链：两个节点 + 连线 -->
  <path d="M25 50.5 L39 50.5" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="20.5" cy="50.5" r="4.2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="43.5" cy="50.5" r="4.2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="20.5" cy="50.5" r="1.5" fill="#2563EB"/>
  <circle cx="43.5" cy="50.5" r="1.5" fill="#2563EB"/>
</svg>
